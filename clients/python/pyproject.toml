[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realm-client"
version = "0.1.0"
description = "Python client for the Realm agent API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bitomia Software SLU" }]
keywords = ["realm", "orchestration", "containers", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/bitomia/realm"
Documentation = "https://bitomia.com/realm"
Source = "https://github.com/bitomia/realm/tree/main/clients/python"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/realm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a running realm agent binary"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
